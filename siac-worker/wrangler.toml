# Cloudflare Worker que importa el horario de SIAC para la app publicada (ver README.md de esta carpeta).
name = "usach-siac"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# orígenes desde donde se puede llamar (la app en GitHub Pages y el servidor local de pruebas)
ALLOWED_ORIGINS = "https://pitttu.github.io,http://localhost:8765"

# a lo más 5 intentos por minuto por IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = false
